services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aas
      POSTGRES_PASSWORD: aas
      POSTGRES_DB: aas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aas']
      interval: 5s
      timeout: 3s
      retries: 10

  # BaSyx V2 — AAS V3 API. 게시 대상은 이 버전으로 확정되어 있다.
  basyx:
    image: eclipsebasyx/aas-environment:2.0.0
    ports:
      - '8081:8081'
    environment:
      SERVER_PORT: 8081
      BASYX_ENVIRONMENT: ''
      BASYX_BACKEND: InMemory
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8081/shells || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
